# ─────────────────────────────────────────────────────────────────────────────
# AI SQL Assistant — Docker Compose
#
# Usage:
#   cp .env.example .env       # fill in real keys
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down -v     # stop + remove volumes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aisql_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       aisql
      POSTGRES_USER:     aisql_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisql_app -d aisql"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: aisql_backend
    restart: unless-stopped
    environment:
      DATABASE_URL:       postgresql+asyncpg://aisql_app:${DB_PASSWORD:-dev_password}@postgres:5432/aisql
      DATABASE_QUERY_URL: postgresql+asyncpg://aisql_query:${QUERY_DB_PASSWORD:-query_password}@postgres:5432/aisql
      LLM_PROVIDER:       ${LLM_PROVIDER:-groq}
      GROQ_API_KEY:       ${GROQ_API_KEY:-}
      NVIDIA_API_KEY:     ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY:     ${OPENAI_API_KEY:-}
      GEMINI_API_KEY:     ${GEMINI_API_KEY:-}
      SECRET_KEY:         ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS:       '["http://localhost","http://localhost:80","http://localhost:3000"]'
      DEBUG:              ${DEBUG:-false}
      LOG_LEVEL:          ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-30}
      RATE_LIMIT:         ${RATE_LIMIT:-60/minute}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── React Frontend (nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
    container_name: aisql_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  pgdata:
  uploads:
