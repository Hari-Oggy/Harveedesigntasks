services:
  postgres:
    image: postgres:15-alpine
    container_name: course_allocation_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: course_allocation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    container_name: course_allocation_backend
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/course_allocation?schema=public
      - JWT_SECRET=supersecret123
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - postgres
    restart: unless-stopped
    command: sh -c "cd /app/packages/db && bunx prisma db push && bun run seed.ts && cd /app/apps/backend && bun index.ts"

  frontend:
    container_name: course_allocation_frontend
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
